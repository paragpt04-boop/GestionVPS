name: Build APK manually
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feature/miami-panel
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python -m compileall -q backend
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: GestionVPS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: GestionVPS-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signing-tool
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
